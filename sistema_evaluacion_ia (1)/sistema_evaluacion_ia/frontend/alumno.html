<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel del alumno</title>

    <link rel="stylesheet" href="css\estilos.css">
</head>

<body>

    <main class="panel-alumno">

        <header class="panel-header">
            <div>
                <h1>Hola, alumno 👋</h1>
                <p>Bienvenido al sistema de evaluaciones.</p>
            </div>

            <button id="cerrar-sesion">Cerrar sesión</button>
        </header>

        <section class="contenido-alumno">

            <h2>Mis evaluaciones</h2>

            <div class="evaluaciones">

                <article class="evaluacion-card">
                    <h3>Evaluación de prueba</h3>

                    <p>
                        Evaluación para probar el sistema.
                    </p>

                    <button>Comenzar evaluación</button>
                </article>

            </div>

        </section>

    </main>

</body>
</html>
